# Runs the E2E suite against the frontend and backend at the chosen refs.
# Manual only: Actions → E2E → Run workflow.
name: E2E

on:
  workflow_dispatch:
    inputs:
      frontend_ref:
        description: "Bomberman-2.0 ref (branch, tag or SHA)"
        required: false
        default: "dev"
      backend_ref:
        description: "Bomberman-2.0-Backend ref (branch, tag or SHA)"
        required: false
        default: "dev"

permissions:
  contents: read

jobs:
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HUSKY: "0"
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4
        with:
          path: e2e
      - uses: actions/checkout@v4
        with:
          repository: NickDurnev/Bomberman-2.0
          ref: ${{ inputs.frontend_ref }}
          path: Bomberman-2.0
      - uses: actions/checkout@v4
        with:
          repository: NickDurnev/Bomberman-2.0-Backend
          ref: ${{ inputs.backend_ref }}
          path: Bomberman-2.0-Backend
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            e2e/package-lock.json
            Bomberman-2.0/package-lock.json
            Bomberman-2.0-Backend/package-lock.json
      - name: Record refs
        run: |
          {
            echo "### Refs under test"
            echo "- Bomberman-2.0 \`${{ inputs.frontend_ref }}\` @ $(git -C ../Bomberman-2.0 rev-parse HEAD)"
            echo "- Bomberman-2.0-Backend \`${{ inputs.backend_ref }}\` @ $(git -C ../Bomberman-2.0-Backend rev-parse HEAD)"
          } >> "$GITHUB_STEP_SUMMARY"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run stack:up
      - run: npx playwright test
      - name: Stop stack
        if: always()
        run: npm run stack:down
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
            e2e/.stack/*.log
          # .stack/ is a hidden folder; upload-artifact skips those by default.
          include-hidden-files: true
          retention-days: 14
